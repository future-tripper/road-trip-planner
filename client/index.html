<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Pathfinder — Connecticut to Del Mar Family Road Trip Planner</title>
    <meta name="description" content="An interactive I-80 family road trip planner from Connecticut to Del Mar, California — Wyoming main route, Colorado weather backup, dog- and toddler-friendly stops." />
    <!-- Personal trip planner — keep it out of search engines -->
    <meta name="robots" content="noindex" />

    <!-- PWA / add-to-home-screen -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#1F4D3A" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pathfinder" />

    <!-- Fontshare: Boska (display serif) + Satoshi (body) -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=boska@500,600,700&f[]=satoshi@400,500,700&display=swap"
      rel="stylesheet"
    />
    <!-- Leaflet CSS is bundled from node_modules via TripMap's import -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
